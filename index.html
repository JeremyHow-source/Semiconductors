<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemiBrain - Enterprise Monitoring</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 9H21M9 3V21M15 3V21M3 15H21" stroke="currentColor" stroke-width="2"/>
                </svg>
                <h1>SemiBrain</h1>
            </div>
            <p class="subtitle">Semiconductor Intelligence & Real-Time Monitoring</p>
        </header>

        <nav class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('search')">Knowledge Base</button>
            <button class="mode-btn" onclick="switchMode('troubleshoot')">Troubleshooter</button>
            <button class="mode-btn" onclick="switchMode('live')">Live Fab Monitor</button>
        </nav>

        <main id="searchMode">
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search roles, defects, or tools..." autofocus>
                </div>
            </div>
            <div id="resultsArea" class="results-area"></div>
        </main>

        <main id="troubleshootMode" style="display: none;">
            <div class="wizard-container">
                <div class="wizard-card" id="wizardContent"></div>
                <div class="visual-flow" id="flowChart"></div>
            </div>
        </main>

        <main id="liveMode" style="display: none;">
            <div class="monitor-container">
                <div class="monitor-header">
                    <h2>Live Machine Log Feed</h2>
                    <div class="monitor-controls">
                        <button id="notifyToggle" class="mode-btn" onclick="toggleNotifications()">🔔 Notifications: OFF</button>
                        <span class="status-indicator live">● Live Connection</span>
                    </div>
                </div>
                <div id="liveFeed" class="live-feed">
                    <div class="empty-state">
                        <p>Waiting for incoming machine logs... (Start the Python monitor script)</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SemiBrain Agent. Powered by Real-Time Data Streaming.</p>
        </footer>
    </div>
    <script src="knowledge_base.js"></script>
    <script src="app.js"></script>
</body>
</html>
